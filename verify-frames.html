<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample to verify frames</title>
</head>
<body>
    <img id="frame" src="/frames/frame_0.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto; border: 1px solid black;" />
    <div style="display: flex; flex-direction: row;">
        <button style="width: 100%; height: 50px; margin: 20px auto;" onclick="updateFrame(-1)">Previous Frame</button>
        <button style="width: 100%; height: 50px; margin: 20px auto;" onclick="updateFrame(1)">Next Frame</button>
    </div>

    <script>
        let frameImg = document.getElementById("frame");
        let frameIndex = 0;
        const totalFrames = 424;

        function updateFrame(direction=1) {
            frameIndex = (frameIndex + direction + totalFrames) % totalFrames;
            frameImg.src = `/frames/frame_${frameIndex}.png`;
        }
        setInterval(updateFrame, 1000 / 60); // Update at 60 FPS
    </script>
</body>
</html>
